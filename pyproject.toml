[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraclelens"
version = "0.1.0"
description = "Reproducible laboratory for oracle failures, attacks and defenses"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "pyyaml>=6", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oraclelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: bp_slow_burn_random
sweep:
  title: Slow-burn adversaries, random trust period, speed and final bias
  fault:
    type: slow_burn
    start: {uniform: [100, 250]}
    growth: {loguniform: [0.0002, 0.002]}
    max_bias: {uniform: [0.01, 0.08]}
    direction: {choice: [-1, 1]}
    trust_noise_factor: 0.2
  seeds: 30
